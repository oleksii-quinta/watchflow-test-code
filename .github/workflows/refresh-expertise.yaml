name: "Refresh Reviewer Expertise Profiles"

on:
  workflow_dispatch:
  schedule:
    # Every 2 hours (UTC). GitHub may delay scheduled runs during high load.
    - cron: "0 */2 * * *"

permissions:
  contents: read
  id-token: write  # required to mint the OIDC token

jobs:
  refresh-expertise:
    name: "Refresh expertise.yaml"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Trigger expertise refresh"
        run: |
          # Fetch a short-lived OIDC JWT scoped to this workflow run.
          # audience must match what the Watchflow app expects ("watchflow").
          OIDC_TOKEN=$(curl --silent --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=watchflow" \
            | jq -r .value)

          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "::error::Failed to obtain OIDC token"
            exit 1
          fi

          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          ATTEMPT=1
          SUCCESS=0
          RESPONSE_FILE=/tmp/response.json

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS}: calling expertise refresh endpoint..."

            HTTP_STATUS=$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out "%{http_code}" \
              --connect-timeout 10 \
              --max-time 30 \
              -X POST "https://nonperceivable-fidelia-tongued.ngrok-free.dev/api/v1/scheduler/refresh-expertise" \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"repo": "${{ github.repository }}"}' || echo "000")

            RESPONSE_SIZE=$(wc -c < "$RESPONSE_FILE" 2>/dev/null || echo "0")
            echo "HTTP status: ${HTTP_STATUS}, response size: ${RESPONSE_SIZE} bytes"

            if [ "$HTTP_STATUS" -eq 200 ] && [ "$RESPONSE_SIZE" -gt 0 ]; then
              SUCCESS=1
              break
            fi

            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              echo "Endpoint not ready yet; waiting ${SLEEP_SECONDS}s before retry..."
              sleep "$SLEEP_SECONDS"
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "::error::Expertise refresh failed after ${MAX_ATTEMPTS} attempts"
            exit 1
          fi

          echo "Expertise refresh succeeded."
          cat "$RESPONSE_FILE"
