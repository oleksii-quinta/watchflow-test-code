name: "Refresh Reviewer Expertise Profiles"

on:
  schedule:
    # Runs every 15 minutes (UTC)
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  refresh-expertise:
    name: "Refresh expertise.yaml for all installed repos"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Trigger expertise refresh"
        env:
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
          WEBHOOK_SECRET_GITHUB: ${{ secrets.WEBHOOK_SECRET_GITHUB }}
        run: |
          echo "Triggering expertise refresh at https://${PUBLIC_DOMAIN}/api/v1/scheduler/refresh-expertise"

          HTTP_STATUS=$(curl --silent --output /tmp/response.json --write-out "%{http_code}" \
            --max-time 30 \
            -X POST "https://${PUBLIC_DOMAIN}/api/v1/scheduler/refresh-expertise" \
            -H "X-Watchflow-Scheduler-Token: ${WEBHOOK_SECRET_GITHUB}" \
            -H "Content-Type: application/json")

          echo "HTTP status: ${HTTP_STATUS}"
          cat /tmp/response.json

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Expertise refresh failed with HTTP ${HTTP_STATUS}"
            exit 1
          fi

          echo "Expertise refresh triggered successfully."
